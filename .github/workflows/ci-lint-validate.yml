name: CI - Lint, Test & Validate FinOps Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f automation/python/requirements.txt ]; then pip install -r automation/python/requirements.txt; fi

      - name: Run FinOps Calculator Unit Tests
        run: |
          python -m unittest discover -s automation/python -p "test_*.py" -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Azure CLI & Bicep Installation
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az bicep build --file bicep/main.bicep --stdout > /dev/null
            az bicep build --file bicep/modules/azurePolicy.bicep --stdout > /dev/null

      - name: Validate JSON Policy Files
        run: |
          for f in policies/*.json; do
            python -m json.tool "$f" > /dev/null
            echo "Valid JSON: $f"
          done

      - name: Syntax Check Scripts
        run: |
          bash -n scripts/validate-all.sh
