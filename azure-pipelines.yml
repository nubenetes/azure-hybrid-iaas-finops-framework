trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: 'Setup Python 3.11'

  - script: |
      python -m unittest discover -s automation/python -p "test_*.py" -v
    displayName: 'Run FinOps Calculator Tests'

  - script: |
      terraform -chdir=terraform init -backend=false
      terraform -chdir=terraform validate
    displayName: 'Validate Terraform'

  - script: |
      az bicep build --file bicep/main.bicep --stdout > /dev/null
    displayName: 'Validate Azure Bicep'
